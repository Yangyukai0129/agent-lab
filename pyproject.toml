[project]
name = "agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kevin_yang", email = "beir6108@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2.15",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
agent-lab = "agent_lab:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
